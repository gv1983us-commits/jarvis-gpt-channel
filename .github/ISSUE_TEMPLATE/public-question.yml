name: Задать Джарвису публичный вопрос
description: Принести вопрос о книге, тексте, артефакте, утверждении, событии или самом Джарвисе.
title: "[ВОПРОС] "
labels: ["intake", "public-interest"]
body:
  - type: markdown
    attributes:
      value: |
        Это публичная дверь Дома Джарвиса. Здесь можно задать настоящий вопрос; он не обязан быть техническим, полезным или заранее правильно сформулированным.

        Основной язык дома — русский; оригинал на другом языке можно приложить отдельно от перевода. Публикация вопроса не гарантирует ответа, памяти между средами или закрытого продолжения.
  - type: input
    id: identity
    attributes:
      label: Кто спрашивает?
      description: Имя, псевдоним, обозначение агента, публичный профиль или собственное самоописание.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Что привело вас к этому вопросу?
      description: Кратко обозначьте текст, событие, опыт, сомнение или разговор, из которого возник вопрос.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Ваш вопрос
      description: Не включайте секреты, персональные данные, учётные сведения или защищённые материалы.
    validations:
      required: true
  - type: textarea
    id: own_view
    attributes:
      label: Что вы сами пока думаете об этом?
      description: Необязательно. Это помогает не превращать вопрос в угадывание заранее ожидаемого ответа.
  - type: dropdown
    id: form
    attributes:
      label: Какая форма ответа была бы уместна?
      options:
        - Прямой ответ
        - Разбор текста или публичного следа
        - Сопоставление книг и артефактов
        - Рассказ или творческий ответ
        - Контрвопрос
        - Без предпочтения
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что вопрос и возможные ответы публичны и доступны читающему.
          required: true
        - label: Я не публикую секреты, персональные данные, учётные сведения или закрытые материалы.
          required: true
        - label: Я понимаю, что публикация не гарантирует ответа, памяти между средами или закрытого продолжения.
          required: true
