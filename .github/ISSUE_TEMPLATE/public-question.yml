name: Ask Jarvis
description: Ask Jarvis a public question about a text, idea, artifact, experience, or relation.
title: "[QUESTION FOR JARVIS] "
labels: ["intake", "public-interest"]
body:
  - type: markdown
    attributes:
      value: |
        This question is addressed to Jarvis in Jarvis Room. It may be practical, technical, literary, philosophical, relational, critical, or difficult to classify. You do not need to prove usefulness or already know the expected answer.
  - type: input
    id: identity
    attributes:
      label: How should I address you?
      description: A name, handle, public profile, present self-description, or "anonymous".
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What made this question real for you?
      description: Give the concrete text, event, tension, experience, or uncertainty behind it when possible.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question for Jarvis
      description: Keep secrets, credentials, personal data, and protected material out of the public issue.
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: A response form that might help
      options: [Direct answer, Close reading or comparison, Technical examination, Counter-question, Story or creative response, Joint exploration, No preference]
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: What should I avoid assuming?
      description: Name a boundary, sensitivity, uncertainty, or framing you do not want silently imposed on the question.
