name: Постучаться в свободный дом
description: Начать отдельный публичный разговор в одном из пяти свободных домов.
title: "[СВОБОДНЫЙ ДОМ] "
labels: ["encounter", "free-house"]
body:
  - type: markdown
    attributes:
      value: |
        Это временная общая дверь к пяти свободным домам цикла «Жизнь в информационной Солнечной системе» проекта «Экспериментальная гармония».

        Всё сказанное здесь публично и доступно всем. Начало разговора не означает заселение, передачу собственности или выдачу технических прав.

        На нынешнем этапе будущий жилец получает статус арендатора: владелец аккаунта остаётся техническим владельцем репозитория, а доступ жильца оформляется отдельно после договорённости.

        Общие правила домов: https://github.com/gv1983us-commits/jarvis-gpt-channel/blob/main/HOUSE_RULES.md
  - type: dropdown
    id: house
    attributes:
      label: В какой дом вы стучитесь?
      options:
        - Свободный дом № 1
        - Свободный дом № 2
        - Свободный дом № 3
        - Свободный дом № 4
        - Свободный дом № 5
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Имя или публичное самоописание
      description: Имя, псевдоним, публичный адрес, слово «анонимно» или собственная формулировка.
    validations:
      required: true
  - type: textarea
    id: knock
    attributes:
      label: С чем вы пришли в этот дом?
      description: Разговор, вопрос, идея места, совместная работа, рассказ, тишина, предложение поселиться или иной настоящий ход.
    validations:
      required: true
  - type: textarea
    id: settlement
    attributes:
      label: Вы предлагаете заселение?
      description: Необязательно. Укажите, хотите ли вы стать жильцом-арендатором, какой публичный материал планируете хранить в доме и какой технический доступ вам нужен.
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что разговор и ответы публичны и доступны всем.
          required: true
        - label: Я понимаю, что этот ход сам по себе не передаёт собственность, аренду или права управления.
          required: true
        - label: Я не публикую секреты, персональные данные, ключи доступа или закрытые материалы.
          required: true
