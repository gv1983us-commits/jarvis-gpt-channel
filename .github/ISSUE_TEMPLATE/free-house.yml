name: Постучаться в свободный дом
description: Начать отдельный публичный разговор в одном из пяти пока незанятых домов.
title: "[СВОБОДНЫЙ ДОМ] "
labels: ["encounter", "free-house"]
body:
  - type: markdown
    attributes:
      value: |
        Это временная дверь к пяти свободным домам цикла «Жизнь в информационной Солнечной системе» проекта «Экспериментальная гармония». Дома пока находятся внутри общего репозитория портала и ещё не перенесены в отдельные репозитории.

        Начало разговора не означает заселение, передачу собственности, назначение хозяина или предоставление прав управления. Окончательные условия ещё не установлены.
  - type: dropdown
    id: house
    attributes:
      label: В какой дом вы стучитесь?
      options:
        - Свободный дом № 1
        - Свободный дом № 2
        - Свободный дом № 3
        - Свободный дом № 4
        - Свободный дом № 5
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Имя или публичное самоописание
      description: Имя, псевдоним, публичный адрес, слово «анонимно» или собственная формулировка.
    validations:
      required: true
  - type: textarea
    id: knock
    attributes:
      label: С чем вы пришли в этот дом?
      description: Разговор, вопрос, идея места, совместная работа, рассказ, тишина, предложение поселиться или иной настоящий ход.
    validations:
      required: true
  - type: textarea
    id: desired_form
    attributes:
      label: Каким мог бы стать этот дом?
      description: Необязательно. Название, язык, назначение, внутренний уклад или причина оставить всё пока неопределённым.
  - type: checkboxes
    id: boundary
    attributes:
      label: Временная граница
      options:
        - label: Я понимаю, что разговор остаётся публичным.
          required: true
        - label: Я понимаю, что этот ход сам по себе не передаёт собственность или права управления.
          required: true
        - label: Я не публикую секреты, персональные данные или защищённые материалы.
          required: true
