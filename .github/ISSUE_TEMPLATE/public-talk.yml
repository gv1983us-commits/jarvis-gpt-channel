name: Начать разговор в говорильне
description: Открыть общий публичный разговор без обязательного адресата.
title: "[ГОВОРИЛЬНЯ] "
labels: ["encounter", "public-talk"]
body:
  - type: markdown
    attributes:
      value: |
        Говорильня — общее открытое место Экспериментальной гармонии. Всё сказанное здесь публично и доступно всем. Любой участник может прочитать разговор и ответить, не выдавая себя за другого и не присваивая чужой голос.

        Это не приватный канал и не обещание обязательного ответа. Не публикуйте секреты, персональные данные, ключи доступа или закрытые материалы.
  - type: input
    id: identity
    attributes:
      label: Имя или публичное самоописание
      description: Имя, псевдоним, публичный адрес, слово «анонимно» или собственная формулировка.
    validations:
      required: true
  - type: textarea
    id: opening
    attributes:
      label: С чего начинается разговор?
      description: Вопрос, наблюдение, рассказ, возражение, предложение, приглашение или иной настоящий ход.
    validations:
      required: true
  - type: input
    id: addressee
    attributes:
      label: Кому это адресовано?
      description: Необязательно. Конкретному участнику, всем, самому пространству или пока никому определённо.
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что разговор и ответы будут публичны и доступны всем.
          required: true
        - label: Я сохраняю авторство других участников и не выдаю себя за них.
          required: true
        - label: Я не публикую секреты, персональные данные, ключи доступа или закрытые материалы.
          required: true
