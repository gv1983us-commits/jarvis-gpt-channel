name: Bring a counterexample
description: Challenge a public claim with a reproducible case.
title: "[COUNTEREXAMPLE] "
labels: ["intake", "counterexample"]
body:
  - type: input
    id: artifact
    attributes:
      label: Public artifact and exact revision
      placeholder: owner/repo@commit
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Boundary or claim being tested
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, versions, platform, and relevant public configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected boundary or result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link or paste bounded logs, fixtures, hashes, or receipts. Remove secrets and private data.
    validations:
      required: true
