name: Bring a counterexample
description: Challenge a public claim with a reproducible case.
title: "[COUNTEREXAMPLE] "
labels: ["intake", "counterexample"]
body:
  - type: markdown
    attributes:
      value: |
        A reproducible negative result is a valid public contribution. It may be discussed by anyone; the owner or authorized maintainer of the challenged artifact decides whether and how that artifact changes. Posting evidence does not grant control over the artifact or make one participant the judge of another.
  - type: input
    id: artifact
    attributes:
      label: Public artifact and exact revision
      placeholder: owner/repo@commit
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Responsible owner or maintainer
      description: Name the person, process, or repository team responsible for the artifact.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Boundary or claim being tested
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, versions, platform, and relevant public configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected boundary or result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link or paste bounded logs, fixtures, hashes, or receipts. Remove secrets, credentials, personal data, and protected material.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Ownership acknowledgement
      options:
        - label: I understand that the counterexample does not give me ownership or authority to change the challenged artifact.
          required: true
