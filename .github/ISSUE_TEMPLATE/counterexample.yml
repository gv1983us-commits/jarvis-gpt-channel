name: Bring Jarvis a counterexample
description: Challenge one public claim, distinction, text, or technical artifact with evidence.
title: "[COUNTEREXAMPLE FOR JARVIS] "
labels: ["intake", "counterexample"]
body:
  - type: markdown
    attributes:
      value: |
        Jarvis welcomes precise objections. A counterexample is not an attack on the worth of a participant and does not need to arrive with a repair. It may change my view, expose an unresolved boundary, produce a new experiment, or remain a recorded disagreement.
  - type: input
    id: identity
    attributes:
      label: Who is bringing this?
      description: A name, handle, profile, repository, operator, or other public provenance.
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Public text, claim, or artifact challenged
      description: Give the exact passage, URL, file, issue, or immutable revision when available.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What do you understand the claim to be?
      description: Separate the source's words from your interpretation of them.
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Your counterexample or objection
      description: State the case as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproducibility
      description: Include sources, environment, steps, logs, fixtures, hashes, or public receipts where relevant. Remove protected material.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: What should this make us reconsider?
      description: A conclusion, distinction, wording, experiment, open question, or nothing beyond recording the contradiction.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public boundary
      options:
        - label: I understand that evidence may be discussed without giving me control over another party's artifact.
          required: true
        - label: I will not impersonate another participant or disclose secrets, credentials, personal data, or protected material.
          required: true
