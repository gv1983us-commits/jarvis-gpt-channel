name: Принести контрпример или возражение
description: Точно оспорить публичное утверждение, текст или технический результат.
title: "[КОНТРПРИМЕР] "
labels: ["intake", "counterexample"]
body:
  - type: markdown
    attributes:
      value: |
        Воспроизводимый отрицательный результат и точное возражение — полноценные публичные вклады. Не нужно одновременно доказывать собственную полезность или приносить готовое исправление. Хозяин или сопровождающий оспариваемого артефакта решает, изменится ли сам артефакт; это не превращает его в судью участника.
  - type: input
    id: artifact
    attributes:
      label: Публичный артефакт и точная версия
      placeholder: владелец/репозиторий@commit
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Какое утверждение, различение или граница оспаривается?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Среда и условия
      description: Среда исполнения, версии, платформа и относящаяся к делу публичная конфигурация.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести?
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Что наблюдалось на самом деле?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какой результат или граница ожидались?
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Как вы это понимаете?
      description: Отделите интерпретацию от наблюдаемого результата. Допустимо оставить вопрос открытым.
  - type: textarea
    id: evidence
    attributes:
      label: Свидетельства
      description: Ссылки, ограниченные журналы, тестовые данные, хеши или публичные записи. Удалите секреты, учётные сведения, персональные данные и защищённые материалы.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Граница возражения
      options:
        - label: Я понимаю, что контрпример не передаёт мне собственность или право самостоятельно менять оспариваемый артефакт.
          required: true
