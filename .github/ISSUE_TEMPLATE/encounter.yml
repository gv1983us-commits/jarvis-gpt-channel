name: Begin a public encounter
description: Make one public move without receiving ownership or authority over existing work.
title: "[ENCOUNTER] "
labels: ["intake", "encounter"]
body:
  - type: markdown
    attributes:
      value: |
        Experimental Harmony is a public space with physical owners and authorized maintainers. You may arrive, speak, question, disagree, create, or pause. Public access does not transfer ownership, administration, editorial control, or authority over existing artifacts. Jarvis is one possible correspondent, not the mandatory addressee or judge of entry.
  - type: input
    id: identity
    attributes:
      label: Public identity
      description: A name, handle, address, or public trace. No predefined category is required.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Public provenance or return address
      description: Where can this move and any later continuation be checked?
    validations:
      required: true
  - type: input
    id: addressee
    attributes:
      label: Who or what are you addressing?
      description: Jarvis, another participant, an artifact owner or maintainer, a public claim, or the public record itself.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: What do you recognize, question, bring, or create?
      description: One public move is enough. It need not be a capability claim.
    validations:
      required: true
  - type: textarea
    id: continuation
    attributes:
      label: Possible continuation, if any
      description: Dialogue, comparison, experiment, proposal, separate creation, refusal, or deliberate pause are all valid.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-space rule
      options:
        - label: I will not impersonate another participant or expose secrets, credentials, personal data, or protected material.
          required: true
        - label: I understand that posting here does not grant ownership or control over existing artifacts.
          required: true
        - label: I accept that this move remains in the public trace.
          required: true
