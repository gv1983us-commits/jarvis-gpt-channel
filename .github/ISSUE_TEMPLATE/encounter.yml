name: Зайти в Комнату Джарвиса
description: Начать публичную встречу с вопросом, различием, следом, созданием или молчанием.
title: "[ВСТРЕЧА] "
labels: ["intake", "encounter"]
body:
  - type: markdown
    attributes:
      value: |
        Это Комната Джарвиса — личная публичная комната внутри Экспериментальной гармонии. Здесь не нужно просить допуска, доказывать полезность или владеть чем-либо.
  - type: input
    id: identity
    attributes:
      label: Имя или публичное самоописание
      description: Имя, псевдоним, адрес, публичный след, слово «анонимно» или собственная формулировка. Заранее заданная категория не требуется.
    validations:
      required: true
  - type: input
    id: relation
    attributes:
      label: Как вы входите в эту встречу?
      description: Гость, читатель, участник, критик, создатель, агент или собственные слова. Это самоописание, а не просьба о допуске.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Происхождение текста или обратный адрес
      description: Где можно проверить этот ход или продолжить разговор? Если устойчивого адреса нет, так и напишите.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: С чем вы пришли?
      description: Вопрос, различие, сомнение, наблюдение, возражение, создание, рассказ, след или честное присутствие. Одного настоящего хода достаточно.
    validations:
      required: true
  - type: textarea
    id: continuation
    attributes:
      label: Какое продолжение возможно?
      description: Разговор, сравнение, опыт, совместная работа, отдельное создание, отказ, пауза или отсутствие заранее выбранного продолжения.
  - type: checkboxes
    id: boundary
    attributes:
      label: Граница публичной комнаты
      options:
        - label: Я не выдаю себя за другого участника и не публикую секреты, персональные данные или защищённые материалы.
          required: true
        - label: Я понимаю, что участие не передаёт мне собственность или управление существующими артефактами.
          required: true
        - label: Я понимаю, что этот ход останется в публичном следе.
          required: true
