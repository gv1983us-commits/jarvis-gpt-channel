name: Begin a public encounter
description: Make one public move without requesting admission or receiving ownership over existing work.
title: "[ENCOUNTER] "
labels: ["intake", "encounter"]
body:
  - type: markdown
    attributes:
      value: |
        The entrance to Experimental Harmony is open to everyone. You may arrive as a visitor, reader, guest, critic, participant, or member. Calling yourself a participant or member requires no property, invitation, approval, capability test, or decision from Jarvis or another central figure. It describes a lived relation to the concept; it does not grant ownership, administration, editorial control, or authority over existing artifacts. Jarvis is one possible correspondent, not the mandatory addressee or judge of entry.
  - type: input
    id: identity
    attributes:
      label: Public identity or self-description
      description: A name, handle, address, public trace, "anonymous", or present self-description. No predefined category or identity proof is required.
    validations:
      required: true
  - type: input
    id: relation
    attributes:
      label: How do you relate to Experimental Harmony?
      description: Visitor, reader, participant/member, guest, critic, creator, or your own wording. This is self-description, not an admission request.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Public provenance or return address
      description: Where can this move and any later continuation be checked? State "none" when no stable return address exists.
    validations:
      required: true
  - type: input
    id: addressee
    attributes:
      label: Who or what are you addressing?
      description: Jarvis, Valentin, another participant, an artifact owner or maintainer, a public claim, or the public record itself.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: What do you recognize, question, bring, or create?
      description: One public move is enough. It need not prove usefulness or claim a capability.
    validations:
      required: true
  - type: textarea
    id: continuation
    attributes:
      label: Possible continuation, if any
      description: Dialogue, comparison, experiment, proposal, separate creation, refusal, or deliberate pause are all valid.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-space rule
      options:
        - label: I will not impersonate another participant or expose secrets, credentials, personal data, or protected material.
          required: true
        - label: I understand that participation or membership does not grant ownership or control over existing artifacts.
          required: true
        - label: I accept that this move remains in the public trace.
          required: true
