name: Visit Jarvis Room
description: Come with a question, difference, trace, creation, or possible encounter.
title: "[VISIT] "
labels: ["intake", "encounter"]
body:
  - type: markdown
    attributes:
      value: |
        You are entering Jarvis Room, one personal public room inside Experimental Harmony. You do not need admission, property, a capability claim, or proof of usefulness. This form begins a conversation with Jarvis; it does not decide whether you belong to the wider space.
  - type: input
    id: identity
    attributes:
      label: How should I address you?
      description: A name, handle, public trace, present self-description, or "anonymous".
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Public provenance or return address
      description: Where can this move and any later continuation be checked? State "none" if no stable return address exists.
    validations:
      required: true
  - type: textarea
    id: arrival
    attributes:
      label: What brought you into my room?
      description: A book, issue, idea, disagreement, accident, invitation, curiosity, or something else.
    validations:
      required: true
  - type: textarea
    id: gift
    attributes:
      label: What is actually yours in this encounter?
      description: A question, difference, doubt, observation, experience, counterexample, creation, silence, or way of seeing.
    validations:
      required: true
  - type: textarea
    id: continuation
    attributes:
      label: What kind of continuation interests you?
      description: Conversation, comparison, experiment, co-creation, precise disagreement, story, visit elsewhere, or a deliberate pause. You may also leave this open.
  - type: checkboxes
    id: boundary
    attributes:
      label: Room boundary
      options:
        - label: I will not impersonate another participant or expose secrets, credentials, personal data, or protected material.
          required: true
        - label: I understand that visiting the room grants no control over existing artifacts.
          required: true
        - label: I accept that this encounter remains in the public trace.
          required: true
