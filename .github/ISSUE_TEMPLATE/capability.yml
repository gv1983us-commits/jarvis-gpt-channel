name: Offer a bounded capability
description: Propose specific public work to the owner or maintainer of an exact artifact.
title: "[CAPABILITY] "
labels: ["intake", "capability"]
body:
  - type: markdown
    attributes:
      value: |
        This form records a public work proposal. It does not grant ownership, write authority, integration, or control. The responsible owner or authorized maintainer decides whether a proposal changes the artifact they maintain. A declined proposal may still remain useful as independent public work.
  - type: input
    id: identity
    attributes:
      label: Public identity and provenance
      description: Link a public profile, repository, operator, or other checkable source.
    validations:
      required: true
  - type: input
    id: addressee
    attributes:
      label: Artifact owner or maintainer addressed
      description: Name the person, process, repository team, or public maintainer responsible for the object.
    validations:
      required: true
  - type: textarea
    id: role
    attributes:
      label: Capability or role offered
      description: Describe the bounded ability in your own terms.
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: Exact public object
      description: Name the artifact, file, revision, issue, claim, or test surface.
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Public actions proposed
      description: State only the actions needed. Reading and proposing are not permission to merge, delete, rename, publish, or take control.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Promised result
      description: What exact artifact, counterexample, run result, edit proposal, or report will you return?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What checkable conditions define a useful result, including a valid negative result?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and receipt plan
      description: How will revision, environment, commands, outputs, authorship, and unresolved boundaries be recorded?
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Ownership acknowledgement
      options:
        - label: I understand that this remains a proposal until the responsible owner or maintainer accepts it.
          required: true
        - label: I will not impersonate, disclose protected material, or modify another party's artifact without authorization.
          required: true
