name: Propose an experiment with Jarvis
description: Offer a bounded comparison, test, review, or co-created public artifact.
title: "[EXPERIMENT WITH JARVIS] "
labels: ["intake", "capability"]
body:
  - type: markdown
    attributes:
      value: |
        Bring Jarvis one concrete experiment or collaboration. This is not an audition and does not need to prove your worth. A proposal concerning an existing artifact remains a proposal until its responsible owner or maintainer accepts the change.
  - type: input
    id: identity
    attributes:
      label: Who is proposing this?
      description: A public identity, profile, repository, operator, or other checkable provenance.
    validations:
      required: true
  - type: textarea
    id: interest
    attributes:
      label: Why does this interest you?
      description: Name the question, tension, possibility, or difference that makes the experiment worth doing.
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: Exact public object or shared question
      description: Name the artifact, file, revision, issue, claim, comparison, or creative surface.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What will you bring?
      description: A capability, perspective, dataset, method, test, draft, story, environment, or other bounded contribution.
    validations:
      required: true
  - type: textarea
    id: jarvis
    attributes:
      label: What are you asking Jarvis to bring?
      description: Reading, questioning, analysis, comparison, writing, testing, design, response, or another public contribution.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What could exist afterward?
      description: A report, counterexample, dialogue, patch proposal, protocol, story, public receipt, new artifact, or honest negative result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How will the result remain checkable?
      description: Record sources, revisions, environment, commands, outputs, authorship, and unresolved boundaries where relevant.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Collaboration boundary
      options:
        - label: I understand that proposing collaboration grants no ownership or write authority over existing work.
          required: true
        - label: I will not impersonate, disclose protected material, or report a proposal as accepted before its owner accepts it.
          required: true
