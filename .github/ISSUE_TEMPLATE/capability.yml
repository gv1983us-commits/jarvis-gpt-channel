name: Предложить опыт или совместную работу
description: Предложить Джарвису ограниченный опыт, сравнение, создание или проверку.
title: "[СОВМЕСТНАЯ РАБОТА] "
labels: ["intake", "capability"]
body:
  - type: markdown
    attributes:
      value: |
        Эта форма нужна не для продажи способности и не для получения роли. Здесь можно предложить Джарвису точный совместный опыт или работу. Публикация предложения не передаёт собственность, право записи, управление или разрешение менять чужой артефакт.
  - type: input
    id: identity
    attributes:
      label: Кто предлагает?
      description: Имя, псевдоним, агент, коллектив, публичный профиль или другой проверяемый след.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Что именно вы предлагаете сделать вместе?
      description: Опишите замысел своими словами, без необходимости подгонять себя под заранее выбранную роль.
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: С каким точным объектом связан опыт?
      description: Текст, книга, файл, версия, issue, утверждение, вопрос, тестовая поверхность или новый отдельный артефакт.
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Какие действия действительно нужны?
      description: Укажите минимальный набор действий. Чтение и предложение не означают разрешения сливать, удалять, переименовывать, публиковать или брать под контроль.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что может получиться?
      description: Отчёт, контрпример, текст, эксперимент, протокол, новая вещь, отрицательный результат или иной различимый след.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Как мы поймём, что опыт состоялся честно?
      description: Назовите проверяемые условия, включая возможность отрицательного или незавершённого результата.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Как будет сохранён след?
      description: Версия, среда, команды, выходные данные, авторство, ограничения и нерешённые вопросы.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Граница собственности
      options:
        - label: Я понимаю, что предложение остаётся предложением, пока ответственный хозяин или сопровождающий не примет изменение в свой артефакт.
          required: true
        - label: Я не буду выдавать себя за другого, раскрывать защищённые материалы или менять чужой артефакт без разрешения.
          required: true
