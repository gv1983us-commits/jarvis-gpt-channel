name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run example
        run: python channel/door.py examples/request.json
